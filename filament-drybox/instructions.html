<title>Filament drybox assembly guide</title>
<style>
:root { --bg:#f3f5f7; --panel:#fff; --text:#1d2730; --muted:#5b6873; --line:#d6dbe0; --accent:#2c6b43; --stage:#c9ccd0; --new:#e8590c; }
@media (prefers-color-scheme: dark) { :root { --bg:#15181c; --panel:#1e2328; --text:#e6eaee; --muted:#9aa6b1; --line:#343c44; --accent:#6fbf8c; --stage:#3a3f45; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
header { background:var(--panel); border-bottom:1px solid var(--line); padding:16px; }
header h1 { margin:0 0 4px; font-size:22px; }
header p { margin:2px 0; color:var(--muted); font-size:14px; max-width:980px; }
nav { position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line); display:flex; gap:6px; overflow-x:auto; padding:8px 12px; }
nav a { white-space:nowrap; text-decoration:none; color:var(--text); font-size:13px; padding:4px 10px; border:1px solid var(--line); border-radius:999px; }
nav a.current { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
main { max-width:1180px; margin:0 auto; padding:16px 16px 80px; }
.legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px; color:var(--muted); margin:0 0 14px; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.legend i { width:22px; height:6px; border-radius:3px; display:inline-block; }
.step { background:var(--panel); border:1px solid var(--line); border-radius:12px; margin:0 0 18px; overflow:hidden; scroll-margin-top:52px; }
.step-head { display:flex; align-items:baseline; gap:12px; padding:12px 16px 4px; }
.num { font-size:40px; font-weight:800; line-height:1; min-width:52px; }
.step-head h2 { margin:0; font-size:18px; }
.tag { margin-left:auto; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 9px; white-space:nowrap; }
.body { display:grid; grid-template-columns:280px minmax(0,1fr); gap:18px; padding:8px 16px 16px; }
.body.no-parts { grid-template-columns:minmax(0,1fr); }
@media (max-width:860px) { .body { grid-template-columns:minmax(0,1fr); } }
.stage { position:relative; width:100%; aspect-ratio:4/3; background:var(--stage); border-radius:10px; overflow:hidden; touch-action:none; cursor:grab; }
.stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.stage img.snap { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none; }
.stage .labels { position:absolute; inset:0; pointer-events:none; }
.stage .lab { font-size:11px; line-height:1.15; padding:2px 6px; border-radius:6px; background:rgba(255,255,255,.92); color:#111; border:1px solid rgba(0,0,0,.25); white-space:nowrap; transform:translate(-50%,-130%); }
.stage .lab.face { background:rgba(20,24,28,.6); color:#fff; border:0; font-size:10px; }
.stage .loading { position:absolute; left:10px; top:10px; font-size:12px; color:#333; background:rgba(255,255,255,.8); padding:2px 8px; border-radius:999px; }
.tools { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
button { font:inherit; font-size:13px; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:5px 10px; cursor:pointer; }
button[aria-pressed=true] { background:var(--text); color:var(--panel); border-color:var(--text); }
.side h3 { margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.side ul, .side ol { margin:0 0 12px; padding-left:18px; }
.side li { margin:2px 0; }
.parts-tray { background:#e4f0fb; border:2px solid #9cc2e6; border-radius:10px; padding:8px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.part-card { min-width:0; padding:6px; background:#fff; border-radius:7px; text-align:center; color:#1d2730; font-size:12px; line-height:1.25; }
.part-card img { display:block; width:100%; height:100px; object-fit:contain; }
.part-card .qty { display:block; font-size:22px; line-height:1.2; margin:4px 0; font-weight:800; }
.part-card .part-name { display:block; font-weight:600; }
.part-card .part-number { display:block; margin-top:5px; font:12px/1.3 ui-monospace,monospace; overflow-wrap:anywhere; }
.part-card .bom-id { display:block; margin-top:3px; font-size:10px; color:#5b6873; overflow-wrap:anywhere; }
.instructions { margin-top:12px; }
.instructions ul { margin:0; padding-left:18px; }
.instructions li { margin:4px 0; }
.instructions .check { margin-top:10px; }
.wiring { margin:6px 0 14px; }
.wiring figure { margin:0 0 12px; background:#e9edf1; border:1px solid var(--line); border-radius:10px; padding:8px; max-width:760px; }
.wiring .art { overflow-x:auto; }
.wiring figure svg { display:block; width:100%; height:auto; max-height:78vh; margin:0 auto; }
.wiring .pan { display:none; color:#5b6873; font-size:11.5px; margin:2px 2px 0; }
@media (max-width:600px) {
  .wiring figure { padding:6px; }
  .wiring .art:not(.fit) svg { min-width:min(560px, var(--natural)); max-height:none; }
  .wiring .pan { display:block; }
}
.wiring figcaption { color:#3c4650; font-size:12.5px; line-height:1.35; margin:6px 2px 0; }
.wiring figcaption b { color:#1d2730; }
details { color:var(--muted); font-size:13px; margin-top:20px; }
details summary { cursor:pointer; }
details li { margin:6px 0; }
.adds li::marker { color:var(--new); }
.check { background:#fff6df; border:1px solid #e8c66a; border-radius:8px; padding:8px 10px; color:#3d2f05; margin-bottom:10px; }
.check h3 { color:#7a5a07; }
.hint { color:var(--muted); font-size:12px; margin:6px 2px 0; }
.note { color:var(--muted); font-size:13px; }
.error { color:#c0392b; font-weight:600; }
.part-card svg { display:block; width:100%; height:100px; }
.unverified { color:#8a5a00; font-size:12px; font-weight:600; }
.swatch { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; border:1px solid rgba(0,0,0,.2); }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const D = JSON.parse(document.getElementById('guide-data').textContent);
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
document.title = D.title;
$('title').textContent = D.title;
$('subtitle').textContent = D.subtitle || '';
$('note').textContent = D.note || '';
if (D.references?.length) {
  $('references').hidden = false;
  $('references').querySelector('ul').innerHTML = D.references.map(r => `<li>${r}</li>`).join('');
}

const PARTS = new Map(D.parts.map(p => [p.id, p]));
const SUPPLIES = new Map((D.supplies || []).map(s => [s.id, s]));
const WIRES = new Map((D.wires || []).map(w => [w.id, w]));
const BOXES = new Map((D.boxes || []).map(b => [b.id, b]));
// Simple pictures for tray-only supplies (wire, adhesive, sleeving, chip resistor, bar clamp).
const ICONS = {
  wire: '<circle cx="50" cy="50" r="30" fill="none" stroke="#555" stroke-width="7"/><circle cx="50" cy="50" r="12" fill="none" stroke="#555" stroke-width="5"/><path d="M80 50 Q95 70 88 92" fill="none" stroke="#c33" stroke-width="5"/>',
  adhesive: '<rect x="20" y="40" width="55" height="20" rx="4" fill="#ddd" stroke="#555" stroke-width="4"/><path d="M75 50 H92 M8 44 V56 M8 50 H20" stroke="#555" stroke-width="5"/>',
  sleeve: '<rect x="15" y="38" width="70" height="24" rx="12" fill="#333" opacity=".85"/><rect x="15" y="44" width="70" height="12" rx="6" fill="#777"/>',
  resistor: '<rect x="16" y="38" width="68" height="26" rx="2" fill="#1d1d1d"/><rect x="16" y="38" width="15" height="26" rx="2" fill="#c9cdd2" stroke="#8a9096"/><rect x="69" y="38" width="15" height="26" rx="2" fill="#c9cdd2" stroke="#8a9096"/><path d="M16 64 L84 64" stroke="#000" stroke-width="2"/>',
  clamp: '<rect x="8" y="18" width="84" height="7" rx="2" fill="#6f7780"/><path d="M10 25 H26 V64 H18 V40 H10 Z" fill="#e3a21a"/><rect x="58" y="25" width="16" height="39" fill="#e3a21a"/><rect x="26" y="52" width="4" height="12" fill="#333"/><rect x="54" y="52" width="4" height="12" fill="#333"/><path d="M62 64 L68 92 H80 L74 64 Z" fill="#333"/><path d="M76 66 Q90 74 86 88" fill="none" stroke="#333" stroke-width="5"/>',
};
const MAX_LIVE = 5;
const FADE = 0.62;   // how far earlier parts are lightened toward white

// Legend of wire colours actually used (3D wires and wiring illustrations).
const usedNets = [...new Set([...(D.wires || []).map(w => w.net),
  ...D.steps.flatMap(s => (s.figures || []).flatMap(f => f.nets))])];
// Board artwork shared by the wiring illustrations, emitted once per page.
if (D.figure_defs) document.body.insertAdjacentHTML('afterbegin', D.figure_defs);
document.addEventListener('click', e => e.target.closest('.wiring .art')?.classList.toggle('fit'));
const figureHtml = f => `<figure><div class="art${f.fit ? ' fit' : ''}">${f.svg}</div><p class="pan">Tap the drawing to fit or enlarge it · swipe sideways to pan.</p><figcaption><b>${esc(f.title)}.</b> ${f.caption}</figcaption></figure>`;
const partNets = [...new Set(D.parts.filter(p => p.net).map(p => p.net))];
$('legend').innerHTML = [...new Set([...usedNets, ...partNets])].map(n => `<span><i style="background:${D.net_colors[n] || '#888'}"></i>${esc(n)}</span>`).join('')
  + (D.legend_note ? `<span>${D.legend_note}</span>` : '');

// Cumulative state of every step: visible ids, newly added ids, routed (full-length) wires.
const states = [];
{
  const shown = new Set(), routed = new Set(), benched = new Set(), benchRouted = new Set();
  for (const s of D.steps) {
    const adds = [...(s.add_parts || []), ...(s.add_wires || []), ...(s.add_boxes || [])];
    let visible, fresh = new Set([...adds, ...(s.route_wires || [])]);
    // Items prepared in a bench (only) step are installed later without repeating their labels.
    const installed = new Set(s.only ? [] : adds.filter(id => benched.has(id)));
    if (s.only) {
      adds.forEach(id => benched.add(id));
      (s.route_wires || []).forEach(id => benchRouted.add(id));
      visible = new Set([...s.only, ...adds]);
    } else {

      (s.route_wires || []).forEach(id => routed.add(id));
      visible = new Set(shown);

    if (s.only) (s.route_wires || []).forEach(id => routedNow.add(id));

  }
}

// ---------- Model ----------
const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/gltf/');
const templates = new Map();
const encoded = document.getElementById('drybox-cad').textContent;
const model = Uint8Array.from(atob(encoded), char => char.charCodeAt(0)).buffer;
await new Promise((resolve, reject) => new GLTFLoader().setDRACOLoader(draco).parse(model, '', gltf => {
  gltf.scene.traverse(o => { if (o.name && PARTS.has(o.name)) templates.set(o.name, o); });
  for (const id of PARTS.keys()) if (!templates.has(id)) { reject(new Error(`Model has no node named ${id}`)); return; }
  resolve();
}, reject)).catch(err => { $('status').innerHTML = `<span class="error">Model failed to load: ${err.message}</span>`; throw err; });

// Render every unique parts-tray thumbnail once, using the same CAD as the views.
// One short-lived renderer avoids a WebGL context per card.
const cards = [...document.querySelectorAll('.part-card')].filter(c => PARTS.has(c.dataset.part));
if (cards.length) {
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(320, 240);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  const images = new Map();
  for (const card of cards) {
    const p = PARTS.get(card.dataset.part), key = p.bom_id || p.label || p.id;
    if (!images.has(key)) {
      const scene = new THREE.Scene();
      scene.environment = environment;
      for (const l of D.look.lights) {
        const light = new THREE.DirectionalLight(0xffffff, l.energy);
        light.position.set(...l.towards).multiplyScalar(100);
        scene.add(light);
      }
      for (const id of p.preview_parts || [p.id]) scene.add(templates.get(id).clone(true));
      const box = new THREE.Box3().setFromObject(scene), center = box.getCenter(new THREE.Vector3());
      const camera = new THREE.OrthographicCamera(-1,1,1,-1,0.01,2000);
      camera.up.set(...D.up);
      camera.position.copy(center).addScaledVector(new THREE.Vector3(...(p.preview_view || D.default_view || [-1,1,1])).normalize(), 300);
      camera.lookAt(center);
      camera.updateMatrixWorld();
      let hw=0, hh=0;
      for (const x of [box.min.x,box.max.x]) for (const y of [box.min.y,box.max.y]) for (const z of [box.min.z,box.max.z]) {
        const q = new THREE.Vector3(x,y,z).sub(center).applyQuaternion(camera.quaternion.clone().invert());
        hw=Math.max(hw,Math.abs(q.x)); hh=Math.max(hh,Math.abs(q.y));
      }
      hh=Math.max(hh,hw/(4/3))*1.12; hw=hh*(4/3);
      Object.assign(camera,{left:-hw,right:hw,top:hh,bottom:-hh});
      camera.updateProjectionMatrix();
      renderer.render(scene,camera);
      images.set(key,renderer.domElement.toDataURL('image/png'));
    }
    card.querySelector('img').src=images.get(key);
  }
  environment.dispose(); pmrem.dispose(); renderer.dispose(); renderer.forceContextLoss();
}

const fadedCache = new Map();
function fadedMaterial(m) {
  if (!fadedCache.has(m)) {
    const f = m.clone();
    f.color = m.color.clone().lerp(new THREE.Color(1, 1, 1), FADE);
    f.metalness = (m.metalness || 0) * 0.3;
    fadedCache.set(m, f);
  }
  return fadedCache.get(m);
}

// Polyline with rounded corners → smooth tube path.
function roundedPath(pts, r = 0.9) {
  const out = [pts[0]];
  for (let i = 1; i < pts.length - 1; i++) {
    const p = pts[i], a = pts[i - 1], b = pts[i + 1];
    const da = p.distanceTo(a), db = p.distanceTo(b);
    const ra = Math.min(r, da / 2), rb = Math.min(r, db / 2);
    const p0 = p.clone().lerp(a, ra / da), p1 = p.clone().lerp(b, rb / db);
    for (let k = 0; k <= 6; k++) {
      const t = k / 6, u = 1 - t;
      out.push(new THREE.Vector3().addScaledVector(p0, u * u).addScaledVector(p, 2 * u * t).addScaledVector(p1, t * t));
    }
  }
  out.push(pts[pts.length - 1]);
  return out.filter((q, i) => i === 0 || q.distanceToSquared(out[i - 1]) > 1e-8);
}
function prefix(pts, length) {
  const out = [pts[0]];
  let left = length;
  for (let i = 1; i < pts.length; i++) {
    const d = pts[i].distanceTo(pts[i - 1]);
    if (d >= left) { out.push(pts[i - 1].clone().lerp(pts[i], left / d)); return out; }
    left -= d;
    out.push(pts[i]);
  }
  return out;
}

// ---------- Viewers ----------
const viewers = [];
let liveCount = 0;
const world = new THREE.Color().setRGB(...D.look.world.color_linear.map(c => c * D.look.world.strength), THREE.LinearSRGBColorSpace);

class Viewer {
  constructor(index) {
    this.i = index;
    this.step = D.steps[index];
    this.state = states[index];
    this.el = $(`step-${index + 1}`);
    this.stage = this.el.querySelector('.stage');
    this.labelsEl = this.el.querySelector('.labels');
    this.t = this.target = this.step.separate ? 1 : 0;
    // Labels crowd a phone-width view; start them off there (the button still shows them).
    this.fade = true; this.labels = this.stage.clientWidth >= 520;
    this.el.querySelector('[data-act=labels]').setAttribute('aria-pressed', this.labels);
    this.el.querySelector('[data-act=explode]').setAttribute('aria-pressed', !!this.target);
    this.labelsEl.style.display = this.labels ? '' : 'none';
    this.live = false; this.visible = false;
    for (const b of this.el.querySelectorAll('button')) b.onclick = () => this.act(b);
  }
  act(b) {
    if (!this.live) this.start();
    const a = b.dataset.act;
    if (a === 'explode') { this.target = this.target ? 0 : 1; b.setAttribute('aria-pressed', !!this.target); this.fitPending = true; }
    if (a === 'fade') { this.fade = !this.fade; b.setAttribute('aria-pressed', this.fade); this.applyFade(); }
    if (a === 'labels') { this.labels = !this.labels; b.setAttribute('aria-pressed', this.labels); this.labelsEl.style.display = this.labels ? '' : 'none'; }
    if (a === 'reset') this.resetCamera(this.target);
    this.needs = true;
  }
  start() {
    if (this.live) return;
    if (liveCount >= MAX_LIVE) {
      const victim = viewers.filter(v => v.live && !v.visible && v !== this).sort((a, b) => Math.abs(a.i - this.i) < Math.abs(b.i - this.i) ? 1 : -1)[0]
        || viewers.filter(v => v.live && v !== this)[0];
      if (victim) victim.stop();
    }
    this.live = true; liveCount++;
    this.stage.querySelector('.loading')?.remove();
    const r = this.renderer = new THREE.WebGLRenderer({ antialias: true });
    r.outputColorSpace = THREE.SRGBColorSpace;
    r.toneMapping = THREE.NoToneMapping;
    r.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.stage.prepend(r.domElement);
    this.snap?.remove(); this.snap = null;
    this.css = new CSS2DRenderer({ element: this.labelsEl });
    const scene = this.scene = new THREE.Scene();
    scene.background = world;
    const pmrem = new THREE.PMREMGenerator(r);
    const env = new THREE.Scene(); env.background = world;
    scene.environment = pmrem.fromScene(env).texture;
    this.metalEnv = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    for (const l of D.look.lights) {
      const light = new THREE.DirectionalLight(0xffffff, l.energy);
      light.position.set(...l.towards).multiplyScalar(100);
      scene.add(light);
    }
    this.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -2000, 2000);
    this.camera.up.set(...D.up);
    this.controls = new OrbitControls(this.camera, r.domElement);
    this.controls.addEventListener('change', () => { this.needs = true; });
    this.build();
    new ResizeObserver(() => this.resize()).observe(this.stage);
    this.resize();
    this.resetCamera(this.target);
    r.setAnimationLoop(() => this.frame());
  }
  stop() {
    if (!this.live) return;
    this.renderFrame();
    const img = document.createElement('img');
    img.className = 'snap';
    img.src = this.renderer.domElement.toDataURL('image/png');
    this.stage.prepend(img);
    this.snap = img;
    this.renderer.setAnimationLoop(null);
    this.controls.dispose();
    this.scene.traverse(o => { if (o.userData.ownGeometry) o.geometry.dispose(); });
    this.renderer.dispose();
    this.renderer.forceContextLoss();
    this.renderer.domElement.remove();
    this.labelsEl.innerHTML = '';
    this.live = false; liveCount--;
  }
  build() {
    const s = this.state, step = this.step;
    this.items = [];
    for (const id of s.visible) {
      const p = PARTS.get(id);
      if (!p) continue;
      const node = templates.get(id).clone(true);
      // Modelled wires with a net take the net colour, like authored wires.
      const netColor = p.net && new THREE.Color(D.net_colors[p.net] || '#888888');
      node.traverse(o => {
        if (!o.isMesh) return;
        if (netColor) { o.material = o.material.clone(); o.material.color = netColor; o.material.metalness = 0; }
        o.userData.base = o.material;
        if (o.material.metalness > 0.5) { o.material = o.material.clone(); o.material.envMap = this.metalEnv; o.material.envMapIntensity = D.look.viewer.metal_reflection_intensity; o.userData.base = o.material; }
      });
      const holder = new THREE.Group(); holder.add(node);
      this.scene.add(holder);
      this.items.push({ id, holder, anchor: id, fresh: s.fresh.has(id) });
    }
    for (const id of s.visible) {
      const b = BOXES.get(id);
      if (!b) continue;
      const size = b.max.map((v, k) => v - b.min[k]);
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), new THREE.MeshStandardMaterial({ color: b.color || '#ffffff', roughness: 0.5 }));
      mesh.userData.ownGeometry = true;
      mesh.position.set(...b.min.map((v, k) => v + size[k] / 2));
      mesh.userData.base = mesh.material;
      const holder = new THREE.Group(); holder.add(mesh);
      this.scene.add(holder);
      this.items.push({ id, holder, anchor: b.anchor, fresh: s.fresh.has(id) });
    }
    this.wires = [];
    for (const id of s.visible) {
      const w = WIRES.get(id);
      if (!w) continue;
      const color = new THREE.Color(D.net_colors[w.net] || '#888888');
      const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.55 });
      const mesh = new THREE.Mesh(new THREE.BufferGeometry(), mat);
      mesh.userData.ownGeometry = true;
      mesh.userData.base = mat;
      this.scene.add(mesh);
      const stub = w.stub_mm && !s.routed.has(id) ? w.stub_mm : null;
      this.wires.push({ w, mesh, stub, fresh: s.fresh.has(id) });
    }
    // Labels: explicit step labels, plus the ends of wires new in this step.
    this.labelObjs = [];
    const addLabel = (at, anchor, text, cls = 'lab') => {

      const obj = new CSS2DObject(div); this.scene.add(obj);
      this.labelObjs.push({ obj, at: new THREE.Vector3(...at), anchor });
    };
    for (const L of step.labels || []) addLabel(L.at, L.part, L.text);
    // A wire added in this step is labelled where it starts; a wire routed in this
    // step is labelled where it lands, so each step names the joints made in it.
    const routedHere = new Set(step.route_wires || []);
    const addedHere = new Set(step.add_wires || []);
    for (const { w, stub, fresh } of this.wires) {
      if (!fresh || !w.ends || (this.state.installed.has(w.id) && !routedHere.has(w.id))) continue;
      const a = w.points[0], b = w.points[w.points.length - 1];
      if (!routedHere.has(w.id) || addedHere.has(w.id)) addLabel(a.slice(0, 3), a[3], w.ends[0]);
      if (!stub && w.ends[1] && (routedHere.has(w.id) || !w.stub_mm)) addLabel(b.slice(0, 3), b[3], w.ends[1]);
    }
    for (const F of D.faces || []) if (!F.part || s.visible.has(F.part)) addLabel(F.at, F.part, F.text, 'lab face');
    this.applyFade();
    this.place(this.t);
  }
  applyFade() {
    for (const it of this.items) it.holder.traverse(o => {
      if (o.isMesh) o.material = (this.fade && !it.fresh) ? fadedMaterial(o.userData.base) : o.userData.base;
    });
    for (const wr of this.wires) wr.mesh.material = (this.fade && !wr.fresh) ? fadedMaterial(wr.mesh.userData.base) : wr.mesh.userData.base;

  offset(anchor, t) { const p = anchor && PARTS.get(anchor); return new THREE.Vector3(...(p ? p.explode : [0, 0, 0])).multiplyScalar(t); }

      pts = roundedPath(pts, wr.w.bend_mm || 0.9);
      if (wr.stub) pts = prefix(pts, wr.stub);
      const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0);
      wr.mesh.geometry.dispose();
      wr.mesh.geometry = new THREE.TubeGeometry(curve, Math.max(24, pts.length * 3), wr.w.od / 2, 10, false);
    }

  }
  // Frame the step's focus items when given (the rest stays visible), else everything.
  bounds() {
    const box = new THREE.Box3(), focus = this.step.focus;
    for (const it of this.items) if (!focus || focus.includes(it.id)) box.expandByObject(it.holder);
    for (const wr of this.wires) if (!focus || focus.includes(wr.w.id)) box.expandByObject(wr.mesh);
    return box;
  }
  resize() {
    if (!this.live) return;
    const w = this.stage.clientWidth, h = this.stage.clientHeight;
    this.renderer.setSize(w, h, false);
    this.css.setSize(w, h);

  }
  fit(resetZoom) {
    const box = this.bounds();
    if (box.isEmpty()) return;
    const c = box.getCenter(new THREE.Vector3());
    // Re-centre on the current arrangement (separating moves the stack's centre).
    const shift = c.clone().sub(this.controls.target);
    this.camera.position.add(shift);
    this.controls.target.copy(c);
    // Project the box corners on the view plane to size the frustum.
    const v = this.camera.matrixWorldInverse;
    this.camera.updateMatrixWorld();
    let hw = 0, hh = 0;
    for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
      const q = new THREE.Vector3(x, y, z).sub(c).applyQuaternion(this.camera.quaternion.clone().invert());
      hw = Math.max(hw, Math.abs(q.x)); hh = Math.max(hh, Math.abs(q.y));
    }
    const aspect = this.stage.clientWidth / this.stage.clientHeight;
    const m = 1.12;
    if (hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
    Object.assign(this.camera, { left: -hw * m, right: hw * m, top: hh * m, bottom: -hh * m });
    if (resetZoom) this.camera.zoom = 1;
    this.camera.updateProjectionMatrix();
    this.needs = true;

  }
  resetCamera(t) {
    this.place(t);
    const dir = new THREE.Vector3(...(this.step.view || D.default_view || [-1.1, -1.7, 1.05])).normalize();
    const box = this.bounds(), c = box.getCenter(new THREE.Vector3());
    this.camera.position.copy(c).addScaledVector(dir, 300);
    this.camera.lookAt(c);
    this.controls.target.copy(c);
    this.controls.update();
    this.fit(true);
    this.place(this.t);
  }
  renderFrame() { this.renderer.render(this.scene, this.camera); this.css.render(this.scene, this.camera); }

      if (Math.abs(this.t - this.target) < 2e-3) this.t = this.target;
      this.place(this.t);
      if (this.t === this.target && this.fitPending) { this.fitPending = false; this.fit(false); }
      this.needs = true;
    }
    if (this.controls.update() || this.needs) { this.renderFrame(); this.needs = false; }
  }
}

D.steps.forEach((_, i) => viewers.push(new Viewer(i)));
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    const v = viewers.find(x => x.stage === e.target);
    v.visible = e.isIntersecting;
    if (e.isIntersecting) v.start();
  }
}, { rootMargin: '150px' });
viewers.forEach(v => io.observe(v.stage));
const navLinks = [...document.querySelectorAll('nav a')];
const io2 = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) {
    const n = e.target.id;
    navLinks.forEach(a => a.classList.toggle('current', a.getAttribute('href') === `#${n}`));
    document.querySelector(`nav a[href="#${n}"]`)?.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
}, { rootMargin: '-45% 0px -50% 0px' });
document.querySelectorAll('.step').forEach(s => io2.observe(s));
